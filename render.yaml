services:
  - type: web
    name: recife-express
    runtime: node
    plan: free
    repo: https://github.com/ruantos/AOS-backend
    branch: main
    buildCommand: npm ci --include=dev && npm run db:generate && npm run db:deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_SECONDS
        value: "3600"
